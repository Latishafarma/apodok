        function hitungUmur(tglLahir) {
            if (!tglLahir) return 0;
            const dob = new Date(tglLahir);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            return isNaN(age) || age < 0 ? 0 : age;
        }

            let base = "px-3 py-2 rounded-xl font-medium text-xs md:text-sm transition flex items-center justify-center gap-1.5 shadow-sm cursor-pointer ";
            let st = "bg-emerald-600 text-white hover:bg-emerald-700";
            if (variant === "secondary") st = "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50";
            else if (variant === "danger") st = "bg-rose-600 text-white hover:bg-rose-700";
            else if (variant === "warning") st = "bg-amber-500 text-white hover:bg-amber-600";
            else if (variant === "info") st = "bg-blue-600 text-white hover:bg-blue-700";
            else if (variant === "purple") st = "bg-purple-600 text-white hover:bg-purple-700";
            return <button type={type} onClick={onClick} className={`${base} ${st} ${className}`}>{icon && <i className={icon}></i>}{children}</button>;

        function DashboardChart({ kunjungankbData, konselingData }) {
            const chartRef = React.useRef(null);
            const chartInstance = React.useRef(null);

            React.useEffect(() => {
                if (chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4', 'Minggu Ini'],
                            datasets: [
                                {
                                    label: 'Kunjungan KB',
                                    data: [2, 4, 3, 5, kunjungankbData.length],
                                    borderColor: '#2563eb',
                                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                                    tension: 0.3,
                                    fill: true
                                },
                                {
                                    label: 'Farmasi Klinis',
                                    data: [1, 3, 2, 4, konselingData.length],
                                    borderColor: '#16a34a',
                                    backgroundColor: 'rgba(22, 163, 74, 0.1)',
                                    tension: 0.3,
                                    fill: true
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top' }
                            },
                            scales: {
                                y: { beginAtZero: true, ticks: { precision: 0 } }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [kunjungankbData, konselingData]);

            return (
                <div className="h-72 w-full relative">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        }

            const importTransaksiKbExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const isKoreksiChecked = document.getElementById('chkKoreksiTanggal')?.checked || false;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, {type: 'array', cellDates: true});
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(sheet);
                        
                        if (json && json.length > 0) {
                            const formatted = json.map((row, idx) => {
                                const namaAkseptorInput = String(row['Nama Akseptor'] || row.namaAkseptor || row.nama || '').trim();
                                const foundAkseptor = (akseptor || []).find(a => (a.nama || '').toLowerCase() === namaAkseptorInput.toLowerCase());
                                
                                let rawTanggal = row.tanggal || row.Tanggal || new Date();
                                let rawTglKembali = row.tglKembali || row['Tanggal Kembali'] || '';

                                const processDate = (val) => {
                                    if (!val) return '';
                                    let d = null;
                                    if (val instanceof Date) {
                                        d = new Date(val.getTime());
                                    } else if (typeof val === 'number') {
                                        const parsedCode = XLSX.SSF.parse_date_code(val);
                                        if (parsedCode) d = new Date(parsedCode.y, parsedCode.m - 1, parsedCode.d);
                                    } else {
                                        const str = String(val).trim().substring(0, 10);
                                        const parts = str.split(/[-/]/);
                                        if (parts.length === 3) {
                                            d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                                        }
                                    }

                                    if (d && !isNaN(d.getTime())) {
                                        if (isKoreksiChecked) {
                                            d.setDate(d.getDate() + 1);
                                        }
                                        const y = d.getFullYear();
                                        const m = String(d.getMonth() + 1).padStart(2, '0');
                                        const day = String(d.getDate()).padStart(2, '0');
                                        return `${y}-${m}-${day}`;
                                    }
                                    return String(val).substring(0, 10);
                                };

                                return {
                                    id: Date.now() + idx, 
                                    tanggal: processDate(rawTanggal), 
                                    akseptorNik: foundAkseptor ? foundAkseptor.nik : '', 
                                    petugasNama: String(row.petugasNama || row['Nama Petugas'] || DEFAULT_DOKTER_NAMA), 
                                    obatNama: String(row.obatNama || row['Nama Obat'] || obatKb[0]?.nama || ''), 
                                    anamnesa: String(row.anamnesa || row.Anamnesa || ''), 
                                    tglKembali: processDate(rawTglKembali), 
                                    status: String(row.status || row.Status || 'Baru')
                                };
                            }).filter(x => x.akseptorNik);
                            
                            if (formatted.length > 0) {
                                setkunjungankb([...kunjungankb, ...formatted]);

                                    <div><label className="block text-xs font-semibold mb-1">Umur (th)</label><input type="text" name="umurPasien" defaultValue={modalConfig.data?.umurPasien || ''} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                    <div><label className="block text-xs font-semibold mb-1">Tinggi (cm)</label><input type="text" name="tinggiPasien" defaultValue={modalConfig.data?.tinggiPasien || ''} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                    <div><label className="block text-xs font-semibold mb-1">Berat (kg)</label><input type="text" name="beratPasien" defaultValue={modalConfig.data?.beratPasien || ''} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                    <div><label className="block text-xs font-semibold mb-1">JK</label><select name="jkPasien" defaultValue={modalConfig.data?.jkPasien || 'Perempuan'} className="w-full border rounded-xl p-2 text-sm"><option value="Perempuan">Perempuan</option><option value="Laki-laki">Laki-laki</option></select></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-xs font-semibold mb-1">Kehamilan</label><input type="text" name="kehamilan" defaultValue={modalConfig.data?.kehamilan || 'Tidak'} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                    <div><label className="block text-xs font-semibold mb-1">Menyusui</label><input type="text" name="menyusui" defaultValue={modalConfig.data?.menyusui || 'Tidak'} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                </div>
                                <div><label className="block text-xs font-semibold mb-1">Uraian Pertanyaan</label><textarea name="uraianPertanyaan" defaultValue={modalConfig.data?.uraianPertanyaan || ''} required className="w-full border rounded-xl p-2 text-sm"></textarea></div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Jenis Pertanyaan</label>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        {ALL_JENIS_PERTANYAAN.map((jp, i) => (
                                            <label key={i} className="flex items-center gap-2"><input type="checkbox" name="jenisPertanyaan" value={jp} defaultChecked={modalConfig.data?.jenisPertanyaan?.includes(jp)} /> {jp}</label>
                                        ))}
                                    </div>
                                </div>
                                <div><label className="block text-xs font-semibold mb-1">Jawaban</label><textarea name="jawaban" defaultValue={modalConfig.data?.jawaban || ''} required className="w-full border rounded-xl p-2 text-sm"></textarea></div>
                                <div><label className="block text-xs font-semibold mb-1">Referensi</label><input type="text" name="referensi" defaultValue={modalConfig.data?.referensi || ''} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                <div><label className="block text-xs font-semibold mb-1">Penyampaian Jawaban</label><select name="penyampaian" defaultValue={modalConfig.data?.penyampaian || 'Segera'} className="w-full border rounded-xl p-2 text-sm"><option value="Segera">Segera</option><option value="Dalam 24 jam">Dalam 24 jam</option><option value="Lebih dari 24 jam">Lebih dari 24 jam</option></select></div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-xs font-semibold mb-1">Apoteker yang Menjawab</label><input type="text" name="apotekerPenjawab" defaultValue={modalConfig.data?.apotekerPenjawab || DEFAULT_APOTEKER_NAMA} required className="w-full border rounded-xl p-2 text-sm" /></div>
                                    <div><label className="block text-xs font-semibold mb-1">Metode Jawaban</label><select name="metodeJawaban" defaultValue={modalConfig.data?.metodeJawaban || 'Lisan'} className="w-full border rounded-xl p-2 text-sm"><option value="Lisan">Lisan</option><option value="Tertulis">Tertulis</option><option value="Telepon">Telepon</option></select></div>
                                </div>
                            </>
                        )}
                    </ModalForm>

                    <PrintModal isOpen={printConfig.isOpen} title={printConfig.title} onClose={() => setPrintConfig({isOpen: false, title: '', content: null})}>
                        {printConfig.content}
                    </PrintModal>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<!-- Masukkan script Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
